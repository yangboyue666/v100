name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Ensure nobodywho 4.0.0
        run: |
          flutter pub deps --no-dev | grep nobodywho || true
          flutter pub upgrade nobodywho || true
          flutter pub deps --no-dev | grep nobodywho || true

      - name: Prepare debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure Rust Android target
        run: |
          if command -v rustup >/dev/null 2>&1; then
            rustup target add aarch64-linux-android || true
            rustup show || true
          fi

      - name: Build release APK (arm64)
        run: |
          flutter build apk --release --target-platform android-arm64 || echo "flutter did not report apk path; searching..."
          echo "=== locate apk files ==="
          find "$GITHUB_WORKSPACE" -name "*.apk" -type f -printf "%s\t%p\n" || true
          mkdir -p artifact
          find "$GITHUB_WORKSPACE" -name "*.apk" -type f -exec cp {} artifact/ \;
          ls -lh artifact || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-assistant-apk
          path: artifact/*.apk
          if-no-files-found: warn

      - name: Publish Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.0
          name: 学生智能助手 v1.7.0（AI入口 + 全屏千问 + 浮动圆球 + 多模型）
          body: |
            ## 本次更新
            - 主界面新增「AI 助手」卡片 → 全屏千问对话页（自由聊天/解数学题/工具调用）
            - 底部对话框收起改为右下角浮动圆球，点击展开有动画效果
            - 嵌入式对话框（普通模型）与全屏 AI（千问模型）完全独立
            - 全屏 AI 页左上角新增模型切换按钮，可切换已下载的模型
            - 输入框 +号/输入框/发送按钮重心对齐修复
            - 新增模型：Llama 3.2 1B/3B、Gemma 2 2B、Phi-3.5 mini（共 7 个可选模型）
            - 保留原有 3 个 Qwen3 模型（0.6B/1.7B/4B）
            - GPU 加速启用（骁龙 Adreno GPU），nobodywho 4.0.0 API
          files: artifact/*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
