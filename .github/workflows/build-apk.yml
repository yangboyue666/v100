name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Ensure nobodywho 4.0.0
        run: |
          flutter pub deps --no-dev | grep nobodywho || true
          flutter pub upgrade nobodywho || true
          flutter pub deps --no-dev | grep nobodywho || true

      - name: Prepare debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure Rust Android target
        run: |
          if command -v rustup >/dev/null 2>&1; then
            rustup target add aarch64-linux-android || true
            rustup show || true
          fi

      - name: Build release APK (arm64)
        run: |
          flutter build apk --release --target-platform android-arm64 || echo "flutter did not report apk path; searching..."
          echo "=== locate apk files ==="
          find "$GITHUB_WORKSPACE" -name "*.apk" -type f -printf "%s\t%p\n" || true
          mkdir -p artifact
          find "$GITHUB_WORKSPACE" -name "*.apk" -type f -exec cp {} artifact/ \;
          ls -lh artifact || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-assistant-apk
          path: artifact/*.apk
          if-no-files-found: warn

      - name: Publish Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.1
          name: 学生智能助手 v1.8.1（修复工具签名解析崩溃）
          body: |
            ## 本次更新
            - 修复关键崩溃：nobodywho 4.0.0 解析工具函数签名时不支持可空类型（String?/int?），已全部改为非空类型+默认值
            - 修复纯聊天模式也崩溃：Tool 对象改为仅在启用工具时构造，避免签名解析误触发
            - 千问模型 enable_thinking=false，按模型能力传 tools，多策略加载回退
            - 模型加载失败不降级普通模型：对话中显示可展开错误详情（查看/复制）
            - 运行日志系统：右上角日志按钮可查看/复制/清空，自动保留 24 小时
            - 完整错误中文解读：区别"模型不支持工具 / GGUF缺模板 / 内存不足 / 文件缺失"
          files: artifact/*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
