name: student_assistant_app
description: 学生智能助手 App - 本地优先、离线可用、免费无 API 调用成本的端侧 AI 学生助手
publish_to: 'none'
version: 1.8.1+9

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1

  # 本地数据库（SQLite）
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # 本地存储偏好
  shared_preferences: ^2.3.2

  # 本地通知
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # 后台任务
  workmanager: ^0.10.10

  # 相机 / 图片
  image_picker: ^1.1.2

  # 工具类
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.18.0
  logger: ^2.4.0

  # UI / 动画
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # 文件选择（用于 CSV 导入 / 模型导入）
  file_picker: ^8.1.4

  # 端侧 AI 推理（GGUF / llama.cpp，支持函数调用）
  nobodywho: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    # 如需启用真实端侧 LLM（Qwen3-0.6B），请取消下行注释并将 gguf 模型放入 assets/model/
    # - assets/model/
